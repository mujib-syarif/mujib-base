name: Optimize Images

# originals/            = untouched masters (read-only for this workflow)
# site/gallery/, site/free/, site/testimoni/ = generated, deployed by Cloudflare
on:
  push:
    branches: [main]
    paths:
      - "originals/*"
      - "originals/free/*"
      - "originals/testimoni/*"
      - "tools/**"
      - ".github/workflows/optimize-images.yml"
  workflow_dispatch:

# One run at a time so two quick pushes never race on the generated files.
concurrency:
  group: optimize-images
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    # Defence in depth: never react to our own commits.
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Generate optimized images and manifests
        run: python tools/optimize_images.py

      - name: Guard - originals must stay untouched
        run: |
          git diff --exit-code --stat -- originals
          test -z "$(git ls-files --others --exclude-standard -- originals)"

      - name: Validate site references
        run: python tools/validate_site.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- site/gallery site/free site/testimoni
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "chore: regenerate optimized images"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
